<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/common.js"></script>
    <style>
      :root {
        --primary-color: #5d4037;
        --primary-dark: #3e2723;
        --primary-light: #efebe9;
        --primary-border: #bcaaa4;
      }

      * { box-sizing: border-box; touch-action: manipulation; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 12px; background-color: #f0f2f5; max-width: 1200px; margin: 0 auto;
      }

      .login-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px;
      }

      .login-card {
        background: white; padding: 25px 20px; border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; width: 100%; max-width: 320px;
      }

      .login-card h3 { margin: 0 0 15px 0; color: #222; font-size: 20px; }
      .login-input { width: 100%; padding: 12px; margin-bottom: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; }
      .login-card button { width: 100%; padding: 12px; font-size: 16px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

      .control-panel {
        background: white; padding: 10px 14px; border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px;
      }

      .single-row {
        display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; flex-wrap: wrap;
      }

      select.nav-select {
        background-color: var(--primary-light); color: var(--primary-dark);
        border: 2px solid var(--primary-border); font-weight: bold; font-size: 15px;
        border-radius: 8px; padding: 6px 8px; cursor: pointer; height: 40px; min-width: 110px;
      }

      .teacher-tag {
        color: var(--primary-dark); font-weight: bold; background-color: var(--primary-light);
        padding: 6px 10px; border-radius: 8px; font-size: 14px; border: 1.5px solid var(--primary-border);
        white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis;
      }

      select, input[type="date"], button.action-btn {
        padding: 6px 12px; font-size: 15px; border-radius: 8px; border: 2px solid #ccc; height: 40px; font-weight: bold;
      }

      select { background-color: white; cursor: pointer; flex: 1; min-width: 100px; }

      .action-btn {
        color: white; border: none; cursor: pointer; font-weight: bold;
        white-space: nowrap; transition: background-color 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px;
      }

      .btn-query { background-color: var(--primary-color); }
      .btn-logout { background-color: #757575; padding: 6px 10px; border: none; }

      .report-container { background: white; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

      .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }

      .summary-card {
        background: var(--primary-light); border: 2px solid var(--primary-border); border-radius: 10px; padding: 10px; text-align: center;
      }
      .summary-card .period { font-weight: bold; color: var(--primary-dark); margin-bottom: 6px; }
      .summary-card .counts { font-size: 13px; color: #333; line-height: 1.6; }

      table.report-table { width: 100%; border-collapse: collapse; font-size: 14px; }
      table.report-table th, table.report-table td { border: 1px solid #ddd; padding: 6px 8px; text-align: center; }
      table.report-table th { background: var(--primary-light); color: var(--primary-dark); }
      table.report-table td.name { text-align: left; font-weight: bold; }

      .status-出席 { color: #2e7d32; font-weight: bold; }
      .status-遲到 { color: #f57f17; font-weight: bold; }
      .status-請假 { color: #0d47a1; font-weight: bold; }
      .status-缺席 { color: #b71c1c; font-weight: bold; }

      @media (max-width: 600px) {
        table.report-table { font-size: 12px; }
        table.report-table th, table.report-table td { padding: 4px 2px; }
      }
    </style>
  </head>
  <body>

    <div id="loginOverlay" class="login-overlay">
      <div class="login-card">
        <h3><i class="fa-solid fa-user-lock"></i> 教師身分驗證</h3>
        <input type="text" id="accountInput" class="login-input" placeholder="請輸入帳號" autocomplete="off">
        <input type="password" id="passwordInput" class="login-input" placeholder="請輸入密碼" onkeypress="if(event.key==='Enter') verifyLogin()">
        <button id="loginBtn" onclick="verifyLogin()"><i class="fa-solid fa-right-to-bracket"></i> 登入系統</button>
      </div>
    </div>

    <div class="control-panel">
      <div class="single-row">
        <select class="nav-select" onchange="navigateToPage(this.value)">
          <option value="Report" selected>📊 節數統計</option>
          <option value="Attendance">📋 點名專區</option>
          <option value="Points">⭐ 加分專區</option>
          <option value="Picker">🎲 抽籤專區</option>
          <option value="SeatMap">🪑 座位表</option>
        </select>

        <div style="display: flex; align-items: center; gap: 4px; flex: 1; flex-wrap: wrap;">
          <span id="teacherNameDisplay" class="teacher-tag" style="display: none;"></span>
          <select id="classSelect">
            <option value="">-- 請先登入 --</option>
          </select>
          <input type="date" id="dateInput">
          <button class="action-btn btn-query" onclick="loadReport()">
            <i class="fa-solid fa-magnifying-glass"></i> 查詢
          </button>
        </div>

        <button id="logoutBtn" class="action-btn btn-logout" title="登出" onclick="logout()" style="display:none;">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>

    <div class="report-container">
      <div id="summaryGrid" class="summary-grid"></div>
      <div style="overflow-x: auto;">
        <table class="report-table" id="detailTable"></table>
      </div>
      <div id="emptyMsg" style="text-align:center; color:#999; padding:20px;">請選擇班別與日期後按「查詢」</div>
    </div>

    <script>
      const PERIODS = ['早修活動','第一節','第二節','第三節','第四節','午餐時間','第五節','第六節','第七節'];
      const STATUSES = ['出席','遲到','請假','缺席'];

      async function loadReport() {
        const selectedClass = document.getElementById('classSelect').value;
        const date = document.getElementById('dateInput').value;
        const summaryGrid = document.getElementById('summaryGrid');
        const detailTable = document.getElementById('detailTable');
        const emptyMsg = document.getElementById('emptyMsg');

        if (!selectedClass) return alert('請先選擇班別！');
        if (!date) return alert('請選擇日期！');

        summaryGrid.innerHTML = '';
        detailTable.innerHTML = '';
        emptyMsg.style.display = 'block';
        emptyMsg.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 載入中...';

        try {
          const members = await getMembersByClass(selectedClass);
          const { data: rows, error } = await window.sb.from('class_attendance')
            .select('*')
            .eq('full_class_name', selectedClass)
            .eq('record_date', date);
          if (error) throw error;

          // map: studentKey -> { period -> status }
          const statusMap = {};
          members.forEach(m => { statusMap[`${m.seatNo}_${m.name}`] = {}; });
          (rows || []).forEach(r => {
            const key = `${r.seat_no}_${r.name}`;
            if (!statusMap[key]) statusMap[key] = {};
            statusMap[key][r.period] = r.status;
          });

          // summary per period
          PERIODS.forEach(p => {
            const counts = { '出席':0,'遲到':0,'請假':0,'缺席':0 };
            let total = 0;
            (rows || []).forEach(r => {
              if (r.period === p && counts[r.status] !== undefined) { counts[r.status]++; total++; }
            });
            if (total === 0) return; // skip periods with no records
            const card = document.createElement('div');
            card.className = 'summary-card';
            card.innerHTML = `
              <div class="period">${p}</div>
              <div class="counts">
                出席 ${counts['出席']} / 遲到 ${counts['遲到']}<br>
                請假 ${counts['請假']} / 缺席 ${counts['缺席']}<br>
                <strong>共 ${total} 筆</strong>
              </div>
            `;
            summaryGrid.appendChild(card);
          });

          if (summaryGrid.children.length === 0) {
            emptyMsg.style.display = 'block';
            emptyMsg.textContent = '該日期沒有任何點名紀錄。';
            return;
          }

          // detail table
          const headerPeriods = PERIODS.filter(p => (rows || []).some(r => r.period === p));
          let html = '<thead><tr><th>座號</th><th>姓名</th>';
          headerPeriods.forEach(p => { html += `<th>${p}</th>`; });
          html += '</tr></thead><tbody>';
          members.forEach(m => {
            const key = `${m.seatNo}_${m.name}`;
            html += `<tr><td>${m.seatNo}</td><td class="name">${m.name}</td>`;
            headerPeriods.forEach(p => {
              const st = (statusMap[key] || {})[p];
              html += `<td class="${st ? 'status-' + st : ''}">${st || '-'}</td>`;
            });
            html += '</tr>';
          });
          html += '</tbody>';
          detailTable.innerHTML = html;
          emptyMsg.style.display = 'none';
        } catch (e) {
          emptyMsg.style.display = 'block';
          emptyMsg.textContent = '載入失敗：' + e.message;
        }
      }

      // default date = today
      window.addEventListener('DOMContentLoaded', () => {
        const di = document.getElementById('dateInput');
        if (di && !di.value) {
          const d = new Date();
          di.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
      });
    </script>
  </body>
</html>
